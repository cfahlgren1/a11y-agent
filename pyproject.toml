[project]
name = "a11y-agent"
version = "0.1.0"
description = "A streaming CLI agent that audits web pages for accessibility, layout, and mobile issues."
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-nebius>=0.1.0",
    "langchain-tavily>=0.2.0",
    "python-dotenv>=1.0.0",
    "python-frontmatter>=1.1.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
a11y-agent = "a11y_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a11y_agent"]
